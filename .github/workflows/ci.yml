name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Needed so the GITHUB_TOKEN can push the built site to the gh-pages branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true
          REACT_APP_OWM_KEY: ${{ secrets.REACT_APP_OWM_KEY }}

      - name: Deploy to GitHub Pages
        # Publish to the gh-pages branch only on pushes to main (not PRs).
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
